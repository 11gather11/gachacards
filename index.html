<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GachaCards｜配信アラート用の透過 WebM を作る</title>
    <meta
      name="description"
      content="画像を1枚入れるだけで、パチンコの保留カラー（白→青→緑→赤→金→虹）で昇格するカード演出を作り、Streamlabs にそのまま使える透過 WebM として書き出します。画像はブラウザの外に出ません。"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1017" />

    <!--
      OGP の画像は、このツール自身の描画コードで作っている（tools/make-assets.mjs）。
      演出を変えたらそこを走らせ直せば追随する。
      og:url と og:image は絶対 URL でないと拾われないので、公開先に合わせること。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GachaCards" />
    <meta property="og:title" content="GachaCards｜配信アラート用の透過 WebM を作る" />
    <meta
      property="og:description"
      content="画像を1枚入れるだけで、保留カラーで昇格するカード演出を作り、Streamlabs にそのまま使える透過 WebM として書き出します。"
    />
    <meta property="og:url" content="https://gachacards.11gather11.com/" />
    <meta property="og:image" content="https://gachacards.11gather11.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      レイヤーの順を、どの CSS よりも先に宣言する。
      順序は「最初に現れた場所」で決まるので、global.css に書くと
      StyleX の priority* のほうが先に登録されてしまい、あとから来る
      Astryx の reset に負けて padding や背景が消える。
      素の要素は Astryx が整え、個別の指定は StyleX が勝つ並びにしたい。
    -->
    <style>
      @layer reset, astryx-base, astryx-theme, priority1, priority2, priority3, priority4,
        priority5;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
