<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Card Alert Maker｜配信アラート用の透過 WebM を作る</title>
    <meta
      name="description"
      content="画像を1枚入れるだけで、パチンコの保留カラー（白→青→緑→赤→金→虹）で昇格するカード演出を作り、Streamlabs にそのまま使える透過 WebM として書き出します。画像はブラウザの外に出ません。"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1017" />

    <!--
      OGP の画像は、このツール自身の描画コードで作っている（tools/make-assets.mjs）。
      演出を変えたらそこを走らせ直せば追随する。
      og:url と og:image は絶対 URL でないと拾われないので、公開先に合わせること。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Card Alert Maker" />
    <meta property="og:title" content="Card Alert Maker｜配信アラート用の透過 WebM を作る" />
    <meta
      property="og:description"
      content="画像を1枚入れるだけで、保留カラーで昇格するカード演出を作り、Streamlabs にそのまま使える透過 WebM として書き出します。"
    />
    <meta property="og:url" content="https://card.11gather11.com/" />
    <meta property="og:image" content="https://card.11gather11.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
