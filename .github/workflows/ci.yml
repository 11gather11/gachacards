name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへ続けて push したとき、古い実行は打ち切る。
# デプロイまで含むので、追い越しで古いビルドが後から出るのを防ぐ意味もある
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Vite+ は Node と pnpm も面倒を見るので、setup-node は要らない
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: '24'
          cache: true

      - run: vp install

      - name: 整形・lint・型チェック
        run: vp check

      - name: 使われていない export を探す
        run: vp run knip

      # カードの描画は OffscreenCanvas や float16 キャンバスに依存していて
      # Node では動かない。テストは実物の Chromium の中で走らせる。
      #
      # 毎回入れ直すと 33 秒かかっていた（apt に 19 秒、ダウンロードに 13 秒）。
      # ブラウザ本体はキャッシュに載せて、ダウンロードのぶんを省く。
      #
      # apt は webkit の分だけ回す。chromium に必要な共有ライブラリは
      # ubuntu-latest に最初から入っているが、webkit の分は入っていない
      - name: ブラウザのキャッシュ
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: ブラウザを用意する
        run: |
          vp exec playwright install chromium webkit
          vp exec playwright install-deps webkit

      # 指紋の比較は OS をまたげないので、CI からは外す。理由は
      # src/card/fingerprint.test.ts の先頭に書いてある
      - name: テスト
        run: vp test run --exclude '**/fingerprint.test.ts'

      # ビーコンはトークンが渡ったときだけ差し込まれる。プルリクのビルドや
      # 手元では未設定なので、集計に載るのは本番だけになる。
      # ページに載せて使う公開値なので secrets ではなく vars に置く
      - name: 本番ビルド
        run: vp run build
        env:
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}

      # main への push のときだけ出す。プルリクではビルドが通るところまで。
      #
      # cloudflare/wrangler-action は使わない。あれは自前で wrangler を入れ直すため
      # パッケージマネージャを PATH から探すが、setup-vp は pnpm を内部で抱えていて
      # 実行ファイルとしては置かれていない。ここまでの手順で入っている
      # devDependency の wrangler をそのまま呼ぶほうが、版もロックと揃う
      - name: Cloudflare Workers へデプロイ
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
