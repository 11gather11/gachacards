<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Card Alert Maker</title>
  <!--
    16x16 まで縮むので、要素はカードの枠だけに絞る。中身を描くと潰れて
    ただの四角になる。虹の枠がこのアプリの見分けなので、そこだけ残す。
  -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d" />
      <stop offset="0.2" stop-color="#ffb84d" />
      <stop offset="0.4" stop-color="#5ce68a" />
      <stop offset="0.6" stop-color="#4dc3ff" />
      <stop offset="0.8" stop-color="#9d7bff" />
      <stop offset="1" stop-color="#ff4d9d" />
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2140" />
      <stop offset="1" stop-color="#141126" />
    </linearGradient>
  </defs>

  <!-- カードは 3:2。横長のアラート枠に合わせている -->
  <rect x="3" y="7" width="26" height="18" rx="4" fill="url(#face)" />
  <rect
    x="3"
    y="7"
    width="26"
    height="18"
    rx="4"
    fill="none"
    stroke="url(#frame)"
    stroke-width="3"
  />
</svg>
