allowBuilds:
  # StyleX の事前コンパイルを走らせる
  '@astryxdesign/core': true
  # どちらも wrangler が抱えている。ビルドを許さないと
  # wrangler がローカルで動かない
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
